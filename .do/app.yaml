# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# Secrets are set in the DigitalOcean dashboard, never here. Full list in .env.example.
name: aywo
region: blr
services:
  - name: api
    github:
      repo: YOUR_GITHUB_ORG/aywo
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_URL
        value: https://api.aywo.in
      - key: WEB_URL
        value: https://aywo.in
static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_ORG/aywo
      branch: main
      deploy_on_push: true
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @aywo/app exec expo export --platform web
    output_dir: apps/app/dist
    catchall_document: index.html
    envs:
      - key: EXPO_PUBLIC_API_URL
        value: https://api.aywo.in
        scope: BUILD_TIME
      - key: EXPO_PUBLIC_RAZORPAY_KEY_ID
        scope: BUILD_TIME
        type: SECRET
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: YOUR_GITHUB_ORG/aywo
      branch: main
    dockerfile_path: apps/api/Dockerfile
    run_command: pnpm exec tsx src/migrate.ts
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_SSL
        value: "true"
ingress:
  rules:
    - component:
        name: api
      match:
        authority:
          exact: api.aywo.in
    - component:
        name: web
      match:
        authority:
          exact: aywo.in
