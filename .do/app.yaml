# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# Secrets are set in the DigitalOcean dashboard, never here. Full list in .env.example.
name: aywo
region: blr
# DigitalOcean emails the team when a deploy or the domain fails. Who gets them is set in the dashboard (Settings, Alerts).
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: api
    github:
      repo: dolluzcorp01/AYWO
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    # The server is struggling: busy, short of memory, or restarting again and again.
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_URL
        value: https://api.aywo.in
      - key: WEB_URL
        value: https://aywo.in
      # Nightly encrypted database backup (docs/runbook-backups.md). Keep a copy of the key outside DigitalOcean.
      - key: BACKUP_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPS_ALERT_EMAIL
        scope: RUN_TIME
        type: SECRET
static_sites:
  - name: web
    github:
      repo: dolluzcorp01/AYWO
      branch: main
      deploy_on_push: true
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @aywo/app exec expo export --platform web
    output_dir: apps/app/dist
    catchall_document: index.html
    envs:
      - key: EXPO_PUBLIC_API_URL
        value: https://api.aywo.in
        scope: BUILD_TIME
      - key: EXPO_PUBLIC_RAZORPAY_KEY_ID
        scope: BUILD_TIME
        type: SECRET
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: dolluzcorp01/AYWO
      branch: main
    dockerfile_path: apps/api/Dockerfile
    # --seed is safe on every deploy: seeds only add missing rows, never overwrite staff edits.
    run_command: pnpm exec tsx src/migrate.ts --seed
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
ingress:
  rules:
    - component:
        name: api
      match:
        authority:
          exact: api.aywo.in
    # Family links go to the API, which serves the same web page with a WhatsApp preview card for that link
    # (apps/api/src/routes/link-page.ts). Must stay above the web rule.
    - component:
        name: api
        preserve_path_prefix: true
      match:
        authority:
          exact: aywo.in
        path:
          prefix: /link/
    - component:
        name: web
      match:
        authority:
          exact: aywo.in
