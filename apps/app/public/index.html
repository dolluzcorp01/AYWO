<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FCFBFF" />
    <title>%WEB_TITLE%</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html, body { height: 100%; background: #FCFBFF; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <style>
      /* Shown from the first byte until the app's code has arrived. Launch.tsx removes it. */
      #aywo-boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FCFBFF; transition: opacity .2s; }
      #aywo-boot.done { opacity: 0; pointer-events: none; }
      #aywo-boot svg { width: 148px; height: 148px; overflow: visible; }
      #aywo-boot .glow { position: absolute; width: 420px; height: 420px; max-width: 100vw; background: radial-gradient(circle at 42% 42%, rgba(142,38,225,.20), transparent 55%), radial-gradient(circle at 60% 60%, rgba(253,142,73,.20), transparent 52%); animation: aywo-glow 2.4s infinite; }
      #aywo-boot .purple { animation: aywo-purple 2.4s infinite; }
      #aywo-boot .orange { animation: aywo-orange 2.4s infinite; }
      #aywo-boot .shine { animation: aywo-shine 2.4s infinite linear; }
      #aywo-boot .bar { position: relative; width: 156px; height: 6px; border-radius: 3px; background: #ECE9F7; overflow: hidden; }
      #aywo-boot .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 42%; background: linear-gradient(90deg, #8E26E1, #FD8E49, #FDD623); animation: aywo-run 1.2s infinite cubic-bezier(.65,0,.35,1); }
      @keyframes aywo-purple { 0%, 4%, 86%, 100% { transform: translate(-21px, -21px); } 18% { transform: translate(1px, 1px); } 24%, 70% { transform: none; } }
      @keyframes aywo-orange { 0%, 4%, 86%, 100% { transform: translate(21px, 21px); } 18% { transform: translate(-1px, -1px); } 24%, 70% { transform: none; } }
      @keyframes aywo-glow { 0%, 60%, 100% { opacity: .35; } 32% { opacity: 1; } }
      @keyframes aywo-shine { 0%, 22% { transform: translateX(-340px); } 60%, 100% { transform: translateX(340px); } }
      @keyframes aywo-run { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) {
        #aywo-boot .purple, #aywo-boot .orange, #aywo-boot .shine, #aywo-boot .glow, #aywo-boot .bar i { animation: none; }
        #aywo-boot .shine { display: none; }
      }
    </style>
  </head>
  <body>
    <noscript>AYWO needs JavaScript. Please turn it on in your browser and open this page again.</noscript>
    <div id="aywo-boot" role="progressbar" aria-label="AYWO">
      <div class="glow"></div>
      <svg viewBox="0 12 500 500" aria-hidden="true">
        <defs>
          <linearGradient id="bp" gradientUnits="userSpaceOnUse" x1="240.0" y1="126.0" x2="197.0" y2="489.0"><stop offset="0" stop-color="#8E26E1"/><stop offset="1" stop-color="#2F3379"/></linearGradient><linearGradient id="bo" gradientUnits="userSpaceOnUse" x1="264.0" y1="289.0" x2="488.0" y2="471.0"><stop offset="0" stop-color="#FD8E49"/><stop offset="1" stop-color="#FDD623"/></linearGradient>
          <linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".36"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <clipPath id="bc"><polygon points="70.5,436.5 247.5,61.5 314.0,194.5"/><polygon points="180.0,348.5 321.5,207.0 429.5,438.0"/></clipPath>
        </defs>
        <g class="purple"><polygon fill="url(#bp)" points="70.5,436.5 247.5,61.5 314.0,194.5"/></g>
        <g class="orange"><polygon fill="url(#bo)" points="180.0,348.5 321.5,207.0 429.5,438.0"/></g>
        <g clip-path="url(#bc)"><rect class="shine" x="130" y="-100" width="240" height="700" fill="url(#bs)" transform-origin="250 250"/></g>
      </svg>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
  </body>
</html>
