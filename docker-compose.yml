# Local development: a Postgres with pgTAP for the rule tests, SeaweedFS for files (photos, voice notes, imports), and the API.
#   docker compose up -d
#   pnpm migrate -- --seed
# Production uses DigitalOcean managed Postgres and Spaces, not these. See docs/DEPLOY.md.
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: aywo
      POSTGRES_PASSWORD: aywo
      POSTGRES_DB: aywo
    ports:
      - "5432:5432"
    volumes:
      - aywo-db:/var/lib/postgresql/data

  # S3-compatible file store standing in for DigitalOcean Spaces on a laptop: SeaweedFS in its one-process "mini" mode.
  # (MinIO was used before, but its images were removed from Docker Hub and quay.io in September 2026.)
  # It creates the private 'aywo' bucket and the login below on start. Keys are local only: production refuses them.
  # The S3 port 8333 is published as 9000, so .env keeps SPACES_ENDPOINT=http://localhost:9000.
  files:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data -bucket=aywo
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "9000:8333"
    volumes:
      - aywo-s3:/data
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://aywo:aywo@db:5432/aywo
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  aywo-db:
  aywo-s3:
