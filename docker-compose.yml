# Local development: a Postgres with pgTAP for the rule tests, MinIO for files (photos, voice notes, imports), and the API.
#   docker compose up -d
#   pnpm migrate -- --seed
# Production uses DigitalOcean managed Postgres and Spaces, not these. See docs/DEPLOY.md.
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: aywo
      POSTGRES_PASSWORD: aywo
      POSTGRES_DB: aywo
    ports:
      - "5432:5432"
    volumes:
      - aywo-db:/var/lib/postgresql/data

  # S3-compatible file store standing in for DigitalOcean Spaces on a laptop. Console: http://localhost:9001
  # (minioadmin / minioadmin, local only: production refuses to start with these).
  files:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aywo-files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Makes the private 'aywo' bucket once, then stops. Safe to run again.
  files-setup:
    image: minio/mc:latest
    depends_on:
      files:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://files:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aywo &&
      mc anonymous set none local/aywo
      "

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://aywo:aywo@db:5432/aywo
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  aywo-db:
  aywo-files:
